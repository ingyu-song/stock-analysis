name: Hourly Coverage News

on:
  schedule:
    # every hour at :17 — GitHub queues cron jobs and the top of the hour is the
    # busiest slot, so an off-peak minute lands closer to on time
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch and print, write nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch coverage news (Naver + global RSS)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/news_check.py --dry-run
            python scripts/news_rss.py --dry-run
          else
            python scripts/news_check.py
            python scripts/news_rss.py
          fi

      - name: Commit news
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/news_global.json

          if git diff --cached --quiet; then
            echo "No new articles — nothing to commit"
            exit 0
          fi
          git commit -m "Hourly news refresh ($(date -u +%Y-%m-%dT%H:%MZ))"

          attempt=1
          max_attempts=5
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Push failed after $max_attempts attempts"
              exit 1
            fi
            echo "Push rejected (remote moved), rebasing — attempt $attempt/$max_attempts"
            git pull --rebase origin main
            attempt=$((attempt + 1))
            sleep $((RANDOM % 8 + 3))
          done
